<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长文朗读器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238a5a2b'/%3E%3Cpath d='M9 13h4l5-4v14l-5-4H9z' fill='%23fff'/%3E%3Cpath d='M21 12.5a5 5 0 0 1 0 7' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f7f4ef">
<style>
  :root{
    --bg:#f7f4ef; --card:#fff; --ink:#24211d; --ink2:#6b645c; --ink3:#9a9188;
    --line:#e5ded3; --accent:#8a5a2b; --accent2:#a9703a;
    --hl:#f9e6c4; --hlb:#d79a4e; --fs:18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  /* 手机浏览器的地址栏会伸缩，100% 有时候算错，底部播放条会被挡在屏幕外。
     100dvh 是「真实可见高度」，支持的浏览器就用它。 */
  @supports (height:100dvh){ html,body{height:100dvh;} }
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:12px 22px; border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.6); flex:none;
  }
  @media (max-width:900px){ header .sub{display:none;} }
  /* 左上角标题做成「回首页」按钮：两行，上行是名字，下行是用途提示 */
  .brand{
    display:flex; flex-direction:column; align-items:flex-start; gap:1px;
    background:none; border:0; padding:2px 7px; margin-left:-7px; border-radius:8px;
    cursor:pointer; font-family:inherit; text-align:left; transition:background .15s;
  }
  .brand:hover{background:#efe8dc;}
  .brand:active{transform:translateY(1px);}
  .brand b{font-size:15px; font-weight:500; margin:0; letter-spacing:.5px;
           color:var(--ink); white-space:nowrap; line-height:1.35;}
  .brand i{font-size:10.5px; font-style:normal; color:var(--ink3); white-space:nowrap; line-height:1.3;}
  .brand:hover i{color:var(--accent);}
  header .sub{font-size:12px; color:var(--ink3); white-space:nowrap;}
  header .spacer{flex:1;}
  .ghost{
    border:1px solid var(--line); background:#fff; color:var(--ink2);
    border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer;
    font-family:inherit; transition:.15s; white-space:nowrap; text-decoration:none;
    display:inline-flex; align-items:center;
  }
  .ghost:hover{border-color:#cfc4b4; color:var(--ink);}
  .ghost:active{transform:translateY(1px);}
  main{flex:1; min-height:0; display:flex; flex-direction:column; position:relative;}

  /* ---------- 输入视图 ---------- */
  #inputView{flex:1; min-height:0; display:flex; flex-direction:column; padding:18px 22px 0;}
  .toolbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding-bottom:12px;
  }
  select{
    font-family:inherit; font-size:13px; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:7px 10px; outline:none; cursor:pointer;
  }
  select:focus{border-color:var(--accent2);}
  .lab{font-size:12px; color:var(--ink3); margin-right:-4px;}
  .switch{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink2); cursor:pointer; user-select:none;}
  .switch input{accent-color:var(--accent); cursor:pointer; width:14px; height:14px;}
  .primary{
    margin-left:auto; border:none; border-radius:9px; cursor:pointer;
    background:var(--accent); color:#fff; font-family:inherit;
    font-size:14px; padding:10px 26px; letter-spacing:1px;
    transition:.15s;
  }
  .primary:hover{background:var(--accent2);}
  .primary:disabled{background:#c9bdb0; cursor:not-allowed;}
  #text{
    flex:1; min-height:0; width:100%; resize:none;
    border:1px solid var(--line); border-radius:12px; background:var(--card);
    padding:20px 22px; font-family:inherit; font-size:16px; line-height:1.85;
    color:var(--ink); outline:none;
  }
  #text:focus{border-color:#d9c9b4;}
  #text::placeholder{color:#b8afa4;}
  .foot{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    font-size:12px; color:var(--ink3); padding:8px 2px 10px;
  }
  .foot #count{flex:none; white-space:nowrap;}
  .foot #tip{min-width:0; text-align:right;}
  .warn{color:#b45309;}

  /* ---------- 阅读视图 ---------- */
  #readView{flex:1; min-height:0; display:none; flex-direction:column;}
  #readView.on{display:flex;}
  #inputView.off{display:none;}
  .reader{
    flex:1; min-height:0; overflow-y:auto; padding:34px 22px 40px;
    scroll-behavior:smooth;
  }
  .paper{max-width:720px; margin:0 auto;}
  .paper p{
    margin:0 0 1.05em; font-size:var(--fs); line-height:1.95;
    text-indent:2em; text-align:justify;
    font-family:"Source Han Serif SC","Noto Serif SC","Songti SC",Georgia,serif;
    color:#2c2823;
  }
  .paper p.cont{text-indent:0;}
  .s{cursor:pointer; border-radius:3px; transition:background .12s;}
  .s:hover{background:#f2ebdf;}
  .s.on{background:var(--hl); box-shadow:inset 0 -1px 0 #e3c48c;}
  .playing-tip{
    max-width:720px; margin:0 auto 18px; font-size:12px; color:var(--ink3);
    display:flex; justify-content:space-between; gap:12px;
  }

  /* ---------- 播放条 ---------- */
  .player{
    flex:none; border-top:1px solid var(--line); background:rgba(255,255,255,.92);
    padding:12px 22px; display:flex; align-items:center; gap:16px;
  }
  .pbtn{
    width:44px; height:44px; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-size:15px; flex:none;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .pbtn:hover{background:var(--accent2);}
  .time{font-size:12px; color:var(--ink2); font-variant-numeric:tabular-nums; flex:none; width:46px;}
  input[type=range]{
    -webkit-appearance:none; appearance:none; height:4px; border-radius:2px;
    background:var(--line); flex:1; outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
    background:var(--accent); cursor:pointer;
  }
  #prog{background:linear-gradient(to right,var(--accent2) 0%,var(--accent2) 0%,var(--line) 0%);}

  /* ---------- 合成进度 ---------- */
  #overlay{
    position:absolute; inset:0; background:rgba(247,244,239,.96);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; z-index:20;
  }
  #overlay.on{display:flex;}
  .ring{
    width:54px; height:54px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .ovt{font-size:14px; color:var(--ink);}
  .ovs{font-size:12px; color:var(--ink3);}
  .bar{width:260px; height:4px; border-radius:2px; background:var(--line); overflow:hidden;}
  .bar i{display:block; height:100%; width:0; background:var(--accent); transition:width .3s;}
  .err{color:#a32d2d; font-size:13px; max-width:520px; text-align:center; line-height:1.7;}
  .hint{font-size:11px; color:var(--ink3); text-align:center; line-height:1.8; max-width:520px;}
  .reader::-webkit-scrollbar{width:9px;}
  .reader::-webkit-scrollbar-thumb{background:#ddd4c6; border-radius:5px;}
  .reader::-webkit-scrollbar-track{background:transparent;}

  /* ---------- 历史面板 ---------- */
  .mask{position:fixed; inset:0; background:rgba(36,33,29,.38); display:none;
        z-index:50; align-items:center; justify-content:center; padding:24px;}
  .mask.on{display:flex;}
  .panel{background:#fff; border-radius:14px; width:min(660px,100%); max-height:76vh;
         display:flex; flex-direction:column; overflow:hidden;
         box-shadow:0 18px 50px rgba(0,0,0,.18);}
  .panel-h{display:flex; align-items:center; justify-content:space-between;
           padding:13px 18px; border-bottom:1px solid var(--line);}
  .panel-h b{font-size:14px; font-weight:500;}
  .panel-b{overflow-y:auto; padding:8px 10px 12px;}
  .hrow{display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;}
  .hrow:hover{background:#faf6ef;}
  .hrow .ht{flex:1; min-width:0;}
  .hrow .hname{font-size:14px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hrow .hmeta{font-size:11.5px; color:var(--ink3); margin-top:3px;}
  .hrow .hact{display:flex; gap:6px; flex:none;}
  .mini{border:1px solid var(--line); background:#fff; border-radius:7px;
        padding:5px 9px; font-size:12px; color:var(--ink2); cursor:pointer;
        font-family:inherit; transition:.15s;}
  .mini:hover{border-color:#cfc4b4; color:var(--ink);}
  .mini.now{border-color:var(--accent2); color:var(--accent);}
  .empty{text-align:center; color:var(--ink3); font-size:13px; padding:36px 0; line-height:1.9;}
  .panel-b::-webkit-scrollbar{width:9px;}
  .panel-b::-webkit-scrollbar-thumb{background:#e2d9cb; border-radius:5px;}

  /* ---------- 手机屏（窄屏） ---------- */
  @media (max-width:600px){
    header{padding:9px 12px; gap:7px;}
    .brand{padding:2px 6px; margin-left:-6px;}
    .brand b{font-size:14px;}
    .brand i{font-size:10px;}
    .ghost{padding:6px 9px; font-size:12.5px;}
    /* 手机浏览器同一时间只会响一个标签页，「另开一篇」在手机上没用，收起来 */
    #btnNew{display:none;}

    #inputView{padding:12px 12px 0;}
    .toolbar{gap:8px; padding-bottom:10px;}
    /* 手机上字号小于 16px 的输入框一旦被点，Safari 会自动放大整页，很烦 */
    select, #text{font-size:16px;}
    /* 音色名很长，不限宽会把「语速」挤到下一行还跟它的下拉框分家 */
    #voice{max-width:198px;}
    .lab{margin-right:0;}
    #text{padding:14px 15px;}
    .foot{font-size:11px; gap:8px;}
    .foot #tip{display:none;}          /* 提示语在手机上挤，去掉，主按钮够明显 */
    .primary{padding:10px 20px; font-size:14px;}

    .reader{padding:18px 15px 30px;}
    .playing-tip{font-size:11.5px; margin-bottom:12px;}

    /* 播放条：一行塞不下 6 个东西，进度条留在第一行，倍速和下载换到第二行靠右 */
    .player{flex-wrap:wrap; gap:8px 10px; padding:9px 12px 11px;}
    .pbtn{width:40px; height:40px; font-size:14px;}
    .time{width:auto; min-width:36px; font-size:11.5px; text-align:center;}
    #prog{flex:1; min-width:80px;}
    #pbRate{margin-left:auto;}
  }
</style>
</head>
<body>
<header>
  <button class="brand" id="btnHome" title="回到首页并清空当前文字；朗读历史还在，随时能重听">
    <b>长文朗读器</b>
    <i>点一下清空重来</i>
  </button>
  <span class="sub">微软 Edge 语音 · 不限字数 · 支持高亮跟读</span>
  <div class="spacer"></div>
  <button class="ghost" id="btnHist">历史</button>
  <button class="ghost" id="btnNew" title="开一个新标签页，可以边听这篇边读另一篇">＋ 另开一篇</button>
  <button class="ghost" id="btnEdit" style="display:none">← 换个文本</button>
  <button class="ghost" id="fsMinus" title="字号变小">A-</button>
  <button class="ghost" id="fsPlus" title="字号变大">A+</button>
</header>

<main>
  <div id="inputView">
    <div class="toolbar">
      <span class="lab">音色</span>
      <select id="voice"></select>
      <span class="lab">语速</span>
      <select id="rate">
        <option value="-25%">很慢</option>
        <option value="-15%">稍慢</option>
        <option value="+0%" selected>正常</option>
        <option value="+15%">稍快</option>
        <option value="+30%">很快</option>
      </select>
      <label class="switch" title="去掉 ** # ` 这类 Markdown 符号，不让它被念出来">
        <input type="checkbox" id="mdClean" checked> 清洗 Markdown 符号
      </label>
      <button class="primary" id="btnGo">开始朗读</button>
    </div>
    <textarea id="text" placeholder="在这里粘贴长文（两万字也没问题），点「开始朗读」。&#10;&#10;从 AI 对话框复制过来的 Markdown 也能直接用，** 和 # 会被自动去掉，不会被念出来。&#10;想同时听两篇，点右上角「＋ 另开一篇」。"></textarea>
    <div class="foot">
      <span id="count">0 字</span>
      <span id="tip">空格播放/暂停 · 点击任意句子跳转 · 右上角可另开一篇同时听</span>
    </div>
  </div>

  <div id="readView">
    <div class="reader" id="reader">
      <div class="playing-tip"><span id="metaInfo"></span><span>点击句子可跳转</span></div>
      <div class="paper" id="paper"></div>
    </div>
    <div class="player">
      <button class="pbtn" id="btnPlay">▶</button>
      <span class="time" id="tCur">0:00</span>
      <input type="range" id="prog" min="0" max="1000" value="0">
      <span class="time" id="tAll">0:00</span>
      <select id="pbRate" title="播放速度">
        <option value="0.75">0.75×</option>
        <option value="1" selected>1.0×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2.0×</option>
      </select>
      <a class="ghost" id="btnDl" href="#" download>下载 MP3</a>
    </div>
  </div>

  <div id="overlay">
    <div class="ring" id="ring"></div>
    <div class="ovt" id="ovMain">正在准备…</div>
    <div class="bar"><i id="ovBar"></i></div>
    <div class="ovs" id="ovSub"></div>
    <div class="err" id="ovErr" style="display:none"></div>
    <div class="hint" id="ovHint">两万字大约需要 2–5 分钟合成，期间可以先做别的</div>
  </div>
</main>

<audio id="au" preload="auto"></audio>

<div class="mask" id="histMask">
  <div class="panel">
    <div class="panel-h">
      <b>最近的朗读</b>
      <button class="ghost" id="histClose">关闭</button>
    </div>
    <div class="panel-b" id="histList"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const els = {
  text:$('text'), voice:$('voice'), rate:$('rate'), btnGo:$('btnGo'),
  count:$('count'), inputView:$('inputView'), readView:$('readView'),
  reader:$('reader'), paper:$('paper'), au:$('au'),
  btnPlay:$('btnPlay'), prog:$('prog'), tCur:$('tCur'), tAll:$('tAll'),
  overlay:$('overlay'), ovMain:$('ovMain'), ovSub:$('ovSub'), ovBar:$('ovBar'),
  ovErr:$('ovErr'), ovHint:$('ovHint'), ring:$('ring'),
  btnEdit:$('btnEdit'), btnDl:$('btnDl'), pbRate:$('pbRate'), metaInfo:$('metaInfo'),
  mdClean:$('mdClean'), btnHist:$('btnHist'), btnNew:$('btnNew'), btnHome:$('btnHome'),
  histMask:$('histMask'), histList:$('histList'), histClose:$('histClose')
};

const FALLBACK_VOICES = {
  "zh-CN-YunxiNeural":"普通话 · 云希 · 男声 · 自然亲和（默认）",
  "zh-CN-XiaoxiaoNeural":"普通话 · 晓晓 · 女声 · 温柔清晰",
  "zh-CN-YunyangNeural":"普通话 · 云扬 · 男声 · 新闻播报",
  "zh-CN-XiaoyiNeural":"普通话 · 晓伊 · 女声 · 年轻活泼",
  "zh-CN-YunjianNeural":"普通话 · 云健 · 男声 · 浑厚有力",
  "zh-CN-YunxiaNeural":"普通话 · 云夏 · 男声 · 少年感"
};

let VOICES = {};
let spans = [], lastIdx = -1, pollTimer = null, pollStart = 0;
let userTouchAt = 0;
let currentKey = '';
let retried = false;
// 每次「重新来过」都 +1。合成/加载是异步的，点回首页之后，
// 还在路上的结果拿这个号对一下，对不上就丢掉，免得刚清空又被旧文章顶回来。
let runSeq = 0;

/* ================= 工具函数 ================= */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmt(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  sec = Math.round(sec);
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
           : `${m}:${String(s).padStart(2,'0')}`;
}
function vname(k){
  const t = VOICES[k] || FALLBACK_VOICES[k] || k;
  const parts = t.split('·').map(x=>x.trim());
  return parts[1] || parts[0];
}

/* ================= Markdown 清洗 ================= */
function stripMd(src){
  let t = String(src).replace(/\r\n?/g, '\n');
  // 围栏代码块：保留里面的内容，去掉围栏那行
  t = t.replace(/^[ \t]*```[^\n]*$/gm, '');
  t = t.replace(/^[ \t]*~~~[^\n]*$/gm, '');
  // 行内代码
  t = t.replace(/`+([^`\n]+)`+/g, '$1');
  // 图片 ![alt](url) → alt
  t = t.replace(/!\[([^\]]*)\]\([^)\s]*(?:\s+"[^"]*")?\)/g, '$1');
  // 链接 [text](url) → text
  t = t.replace(/\[([^\]]+)\]\([^)\s]*(?:\s+"[^"]*")?\)/g, '$1');
  // 引用块标记
  t = t.replace(/^[ \t]{0,3}>[ \t]?/gm, '');
  // ATX 标题
  t = t.replace(/^[ \t]{0,3}#{1,6}[ \t]*/gm, '');
  // 水平分割线
  t = t.replace(/^[ \t]{0,3}([-*_])[ \t]*(?:\1[ \t]*){2,}$/gm, '');
  // 表格对齐行 |---|:--:|
  t = t.replace(/^[ \t]*\|?[ \t:|-]{3,}\|?[ \t:|-]*$/gm, '');
  // 粗体 / 斜体 / 删除线（先长后短，避免 ** 被当成两个 *）
  t = t.replace(/(\*\*\*|___)([^\n]+?)\1/g, '$2');
  t = t.replace(/(\*\*|__)([^\n]+?)\1/g, '$2');
  t = t.replace(/~~([^\n]+?)~~/g, '$1');
  // 斜体：前后可能是中文、空白或中英标点（CJK 也纳入，否则「不是*目标*，」这种清不掉）
  const CJK = '\\u4e00-\\u9fa5';
  t = t.replace(new RegExp('(^|[\\s（(【「《，。、！？；：,.' + CJK + '])\\*([^*\\n]+?)\\*(?=[\\s）)】」》，。、！？；：,.' + CJK + ']|$)', 'g'), '$1$2');
  t = t.replace(new RegExp('(^|[\\s（(【「《，。、！？；：,.' + CJK + '])_([^_\\n]+?)_(?=[\\s）)】」》，。、！？；：,.' + CJK + ']|$)', 'g'), '$1$2');
  // 行首列表符号（- * + 1. 1)）
  t = t.replace(/^[ \t]{0,3}[-*+][ \t]+/gm, '');
  t = t.replace(/^[ \t]{0,3}\d{1,3}[.)][ \t]+/gm, '');
  // 表格竖线
  t = t.replace(/[ \t]*\|[ \t]*/g, ' ');
  // 清掉多余空格（去掉竖线后常留下双空格和行首空格）
  t = t.replace(/[ \t]{2,}/g, ' ').replace(/^[ \t]+|[ \t]+$/gm, '');
  // HTML 标签
  t = t.replace(/<\/?[a-zA-Z][^>]*>/g, '');
  // 常见 HTML 实体
  t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  // 收尾：行尾空格、连续空行
  t = t.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n');
  return t.trim();
}

/* ================= 历史记录 ================= */
const HKEY = 'ra_hist_v1';
const HMAX = 60;
function histLoad(){
  try{ const a = JSON.parse(localStorage.getItem(HKEY) || '[]'); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function histSave(list){
  // localStorage 大约 5MB，超了就从最旧的开始丢正文
  let json = JSON.stringify(list);
  let i = list.length - 1;
  while(json.length > 3_000_000 && i >= 0){
    if(list[i].text){ list[i] = Object.assign({}, list[i], {text: undefined}); }
    json = JSON.stringify(list);
    i--;
  }
  try{ localStorage.setItem(HKEY, json); }
  catch(e){
    try{ localStorage.setItem(HKEY, JSON.stringify(list.slice(0, 10))); }catch(_){}
  }
}
function histGet(key){ return histLoad().find(x => x.key === key); }
function histAdd(item){
  const list = histLoad().filter(x => x.key !== item.key);
  list.unshift(item);
  histSave(list.slice(0, HMAX));
}
function histDel(key){
  histSave(histLoad().filter(x => x.key !== key));
  histRender();
}
function titleOf(text){
  const line = String(text).trim().split('\n').map(s=>s.trim()).find(s=>s.length) || '未命名';
  return line.length > 40 ? line.slice(0, 40) + '…' : line;
}
function histRender(){
  const list = histLoad();
  if(!list.length){
    els.histList.innerHTML = '<div class="empty">还没有记录。<br>读过的内容会自动存在这里，下次想重听点一下就开。</div>';
    return;
  }
  els.histList.innerHTML = list.map(x=>{
    const when = new Date(x.ts);
    const d = `${when.getMonth()+1}/${when.getDate()} ${String(when.getHours()).padStart(2,'0')}:${String(when.getMinutes()).padStart(2,'0')}`;
    return `<div class="hrow" data-key="${x.key}">
      <div class="ht">
        <div class="hname">${esc(x.title || '未命名')}</div>
        <div class="hmeta">${(x.chars||0).toLocaleString()} 字 · ${fmt((x.duration||0)/1000)} · ${esc(vname(x.voice))} · ${d}</div>
      </div>
      <div class="hact">
        <button class="mini play" data-key="${x.key}">重听</button>
        <button class="mini newwin" data-key="${x.key}" title="在新标签页打开，可以两篇一起听">新窗口</button>
        <button class="mini del" data-key="${x.key}" title="从历史里删掉">删</button>
      </div>
    </div>`;
  }).join('');
}
els.btnHist.onclick = ()=>{ histRender(); els.histMask.classList.add('on'); };
els.histClose.onclick = ()=> els.histMask.classList.remove('on');
els.histMask.addEventListener('click', e=>{ if(e.target === els.histMask) els.histMask.classList.remove('on'); });
els.histList.addEventListener('click', e=>{
  const b = e.target.closest('button');
  if(!b) return;
  const key = b.dataset.key;
  if(b.classList.contains('del')){ histDel(key); return; }
  els.histMask.classList.remove('on');
  if(b.classList.contains('newwin')){
    window.open(location.origin + '/?key=' + key, '_blank');
  }else{
    playKey(key);
  }
});

/* ================= 初始化 ================= */
(async function init(){
  let voices = FALLBACK_VOICES;
  try{
    const r = await fetch('/api/voices');
    if(r.ok) voices = await r.json();
  }catch(e){}
  VOICES = voices;

  // 按「分组」生成 optgroup
  const groups = new Map();
  Object.entries(voices).forEach(([k,v])=>{
    const g = (String(v).split('·')[0] || '其他').trim();
    if(!groups.has(g)) groups.set(g, []);
    groups.get(g).push([k, v]);
  });
  let html = '';
  for(const [g, arr] of groups){
    html += `<optgroup label="${esc(g)}">`;
    for(const [k,v] of arr){
      html += `<option value="${k}">${esc(v.replace(/^[^·]*·\s*/, ''))}</option>`;
    }
    html += '</optgroup>';
  }
  els.voice.innerHTML = html;

  const saved = localStorage.getItem('ra_text');
  if(saved) els.text.value = saved;
  // 手机上没有「另开一篇」按钮，提示语就不要提它
  if(innerWidth <= 600){
    els.text.placeholder = '在这里粘贴长文（两万字也没问题），点「开始朗读」。\n\n'
      + '从 AI 对话框复制过来的 Markdown 也能直接用，** 和 # 会被自动去掉，不会被念出来。';
  }
  const sv = localStorage.getItem('ra_voice');
  if(sv && voices[sv]) els.voice.value = sv;
  const sr = localStorage.getItem('ra_rate');
  if(sr) els.rate.value = sr;
  const fs = localStorage.getItem('ra_fs');
  if(fs) document.documentElement.style.setProperty('--fs', fs+'px');
  // Markdown 清洗开关
  const mc = localStorage.getItem('ra_md');
  els.mdClean.checked = mc === null ? true : mc === '1';
  // 播放倍速：读回上次的值并真正写进 audio
  const pr = localStorage.getItem('ra_pbrate');
  if(pr && [...els.pbRate.options].some(o=>o.value===pr)) els.pbRate.value = pr;
  applyRate();
  updateCount();

  // 深链：?key=xxx 直接进阅读视图
  const q = new URLSearchParams(location.search);
  const key = q.get('key');
  if(key){
    els.inputView.classList.add('off');
    els.readView.classList.add('on');
    els.btnEdit.style.display = '';
    loadReady(key);
  }else if(q.get('new') === '1'){
    // 新开的另一篇，清空输入框，别被上一篇的正文带偏
    els.text.value = '';
    updateCount();
    els.text.focus();
  }
})();

els.text.addEventListener('input', ()=>{
  updateCount();
  clearTimeout(els.text._t);
  els.text._t = setTimeout(()=>localStorage.setItem('ra_text', els.text.value), 500);
});
els.voice.addEventListener('change', ()=>localStorage.setItem('ra_voice', els.voice.value));
els.rate.addEventListener('change', ()=>localStorage.setItem('ra_rate', els.rate.value));
els.mdClean.addEventListener('change', ()=>localStorage.setItem('ra_md', els.mdClean.checked ? '1' : '0'));

$('fsPlus').onclick = ()=>setFs(1);
$('fsMinus').onclick = ()=>setFs(-1);
function setFs(d){
  const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs')) || 18;
  const nv = Math.min(26, Math.max(14, cur + d*2));
  document.documentElement.style.setProperty('--fs', nv+'px');
  localStorage.setItem('ra_fs', nv);
}

function updateCount(){
  const n = els.text.value.length;
  let s = n.toLocaleString() + ' 字';
  if(n === 0) s = '0 字';
  else if(n > 20000) s = n.toLocaleString() + ' 字 · 较长，合成需几分钟';
  els.count.textContent = s;
  els.count.className = n > 40000 ? 'warn' : '';
}

/* ================= 另开一篇 ================= */
els.btnNew.onclick = ()=>{
  window.open(location.origin + '/?new=1', '_blank');
};

/* ================= 发起合成 ================= */
els.btnGo.onclick = ()=>{
  const raw = els.text.value.trim();
  if(!raw){ els.text.focus(); return; }
  const text = els.mdClean.checked ? stripMd(raw) : raw;
  if(!text){ showError('清洗之后没有剩下可读的文字，检查一下文本内容。'); return; }
  startSynth(text, els.voice.value, els.rate.value);
};

async function startSynth(text, voice, rate){
  retried = false;
  const my = ++runSeq;
  localStorage.setItem('ra_text', els.text.value);
  showOverlay('正在连接语音服务…', '');
  try{
    const r = await fetch('/api/synth', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text, voice, rate})
    });
    const j = await r.json();
    if(my !== runSeq) return;
    if(!r.ok) throw new Error(j.error || '请求失败');
    if(j.cached){ await loadReady(j.key, text, voice, rate, my); return; }
    pollStart = Date.now();
    pollJob(j.key, j.chars, text, voice, rate, my);
  }catch(e){
    if(my !== runSeq) return;
    showError('合成失败：' + e.message);
  }
}

function pollJob(key, chars, text, voice, rate, my){
  clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    // 用户已经点了「回首页」或重新发起了一次合成，这轮结果作废
    if(my !== undefined && my !== runSeq){ clearInterval(pollTimer); return; }
    try{
      const r = await fetch('/api/job?key=' + key);
      const j = await r.json();
      if(j.state === 'ready'){ clearInterval(pollTimer); await loadReady(key, text, voice, rate); return; }
      if(j.state === 'error'){ clearInterval(pollTimer); showError(j.err || '合成出错'); return; }
      const pct = j.total ? Math.round(j.done / j.total * 100) : 0;
      els.ovMain.textContent = `正在合成 ${j.done}/${j.total} 段`;
      els.ovBar.style.width = pct + '%';
      const elapsed = Math.round((Date.now() - pollStart)/1000);
      els.ovSub.textContent = `已完成 ${pct}% · 已用 ${elapsed} 秒 · 共 ${(chars||0).toLocaleString()} 字`;
      els.ovHint.textContent = '合成完成后会自动开始播放，并逐句高亮';
    }catch(e){}
  }, 800);
}

function showOverlay(main, sub){
  els.overlay.classList.add('on');
  els.ring.style.display = 'block';
  els.ovBar.parentElement.style.display = 'block';
  els.ovErr.style.display = 'none';
  els.ovMain.textContent = main;
  els.ovSub.textContent = sub || '';
  els.ovHint.style.display = 'block';
}
function showError(msg){
  els.overlay.classList.add('on');
  els.ring.style.display = 'none';
  els.ovBar.parentElement.style.display = 'none';
  els.ovErr.style.display = 'block';
  els.ovMain.textContent = '没有成功';
  els.ovSub.textContent = '';
  els.ovErr.textContent = msg;
  els.ovHint.textContent = '常见原因：网络中断、或微软接口临时限流。点「← 换个文本」返回后可再试一次。';
}

/* ================= 加载并渲染 ================= */
function playKey(key){
  els.histMask.classList.remove('on');
  els.au.pause();
  els.inputView.classList.add('off');
  els.readView.classList.add('on');
  els.btnEdit.style.display = '';
  history.replaceState(null, '', '/?key=' + key);
  loadReady(key);
}

async function loadReady(key, text, voice, rate, my){
  currentKey = key;
  let data = null;
  try{
    const r = await fetch('/timings/' + key + '.json');
    if(r.ok) data = await r.json();
  }catch(e){}
  // 等数据的这段时间里用户可能已经点了左上角回首页，这时就别再把旧文章推上来
  if(my !== undefined && my !== runSeq) return;

  if(!data){
    // 音频没了：如果历史里存过原文，就自动重新合成一次
    const h = histGet(key);
    if(h && h.text && !retried){
      retried = true;
      showOverlay('这篇的音频已被清理，正在重新合成…', '');
      startSynth(h.text, h.voice || voice || els.voice.value, h.rate || rate || els.rate.value);
      return;
    }
    showError('这篇的音频已经不在了（可能是缓存被清理或换了电脑）。返回后把原文重新粘一次即可。');
    return;
  }

  spans = data.spans || [];
  renderReader(data.text);
  els.au.src = '/audio/' + key + '.mp3';
  els.btnDl.href = '/audio/' + key + '.mp3?dl=1';
  els.tAll.textContent = fmt(data.duration/1000);
  metaBase = `${(data.chars||0).toLocaleString()} 字 · ${fmt(data.duration/1000)} · ${vname(data.voice)}`;
  els.metaInfo.textContent = metaBase;
  els.overlay.classList.remove('on');
  els.inputView.classList.add('off');
  els.readView.classList.add('on');
  els.btnEdit.style.display = '';
  lastIdx = -1;
  history.replaceState(null, '', '/?key=' + key);

  // 记进历史
  histAdd({
    key,
    title: titleOf(data.text || text || ''),
    chars: data.chars || (data.text || '').length,
    duration: data.duration || 0,
    voice: data.voice || voice || '',
    rate: data.rate || rate || '',
    ts: Date.now(),
    text: data.text || text || ''
  });

  applyRate();
  tryPlay();
}

/* 手机上（尤其 iPhone）浏览器只允许「用户手指点下去的那一刻」开始放音。
   我们的声音是服务器合成完才回来的，那时候手指早就抬起来了，所以会被拦。
   被拦下不报错，只是没声音——所以这里记一笔，等用户下一次碰屏幕再接上。 */
let pendingPlay = false, metaBase = '';
function tryPlay(base){
  if(base !== undefined) metaBase = base;
  const pr = els.au.play();
  if(pr && pr.catch) pr.catch(()=>{ pendingPlay = true; markNeedTap(); });
}
function markNeedTap(){
  if(!pendingPlay) return;
  els.btnPlay.textContent = '▶';
  els.metaInfo.textContent = metaBase + ' · 点下面的 ▶ 开始放音';
}
function flushPending(){
  if(!pendingPlay) return;
  pendingPlay = false;
  els.metaInfo.textContent = metaBase;
  const pr = els.au.play();
  if(pr && pr.catch) pr.catch(()=>{ pendingPlay = true; markNeedTap(); });
}

function renderReader(text){
  const paras = [];
  let s = 0, i = 0;
  const push = (a, b) => {
    if(b > a && text.slice(a, b).trim())
      paras.push({s:a, e:b, cont: a > 0 && text[a-1] !== '\n'});
  };
  while(i < text.length){
    const ch = text[i];
    if(ch === '\n'){ push(s, i); s = i + 1; }
    else if(i - s >= 400 && /[。！？!?；;]/.test(text[i-1])){ push(s, i); s = i; }
    i++;
  }
  push(s, text.length);
  let html = '', k = 0;
  for(const p of paras){
    while(k < spans.length && spans[k].e <= p.s) k++;
    let cur = p.s, j = k, inner = '';
    while(j < spans.length && spans[j].s < p.e){
      const sp = spans[j];
      const ss = Math.max(sp.s, p.s), se = Math.min(sp.e, p.e);
      if(ss > cur) inner += esc(text.slice(cur, ss));
      if(se > ss) inner += `<span class="s" data-i="${j}">${esc(text.slice(ss, se))}</span>`;
      cur = Math.max(cur, se);
      j++;
    }
    if(cur < p.e) inner += esc(text.slice(cur, p.e));
    html += `<p${p.cont ? ' class="cont"' : ''}>` + inner + '</p>';
  }
  els.paper.innerHTML = html;
}

/* ================= 播放控制 ================= */
// 倍速：显示的值必须真的写进 audio，否则会出现「显示 1.5、实际 1.0」
function applyRate(){
  const v = parseFloat(els.pbRate.value) || 1;
  try{ els.au.defaultPlaybackRate = v; }catch(e){}
  try{ els.au.playbackRate = v; }catch(e){}
}
els.pbRate.onchange = ()=>{
  applyRate();
  localStorage.setItem('ra_pbrate', els.pbRate.value);
};
// 换音源、开始播放、元数据就绪之后都再写一次，防止被重置回 1.0
els.au.addEventListener('loadedmetadata', applyRate);
els.au.addEventListener('play', applyRate);
els.au.addEventListener('playing', applyRate);

els.btnPlay.onclick = ()=>{
  if(els.au.paused){ pendingPlay = false; els.metaInfo.textContent = metaBase; els.au.play().catch(()=>{}); }
  else els.au.pause();
};
// 上一次自动放音被浏览器拦了的话，用户随便点一下屏幕就接上
document.addEventListener('touchstart', flushPending, {passive:true});
document.addEventListener('click', flushPending);
els.au.addEventListener('play', ()=>els.btnPlay.textContent = '❚❚');
els.au.addEventListener('pause', ()=>els.btnPlay.textContent = '▶');
els.au.addEventListener('ended', ()=>els.btnPlay.textContent = '↻');

els.prog.addEventListener('input', ()=>{
  const d = els.au.duration;
  if(isFinite(d) && d > 0) els.au.currentTime = d * (els.prog.value/1000);
});

els.au.addEventListener('timeupdate', ()=>{
  const cur = els.au.currentTime, d = els.au.duration;
  els.tCur.textContent = fmt(cur);
  if(isFinite(d) && d > 0){
    const p = cur/d;
    els.prog.value = Math.round(p*1000);
    els.prog.style.background = `linear-gradient(to right,var(--accent2) ${p*100}%,var(--line) ${p*100}%)`;
    els.tAll.textContent = fmt(d);
  }
  highlight(cur);
});

function highlight(sec){
  if(!spans.length) return;
  const ms = sec * 1000;
  let lo = 0, hi = spans.length - 1, ans = 0;
  while(lo <= hi){
    const m = (lo + hi) >> 1;
    if(spans[m].t <= ms){ ans = m; lo = m + 1; } else hi = m - 1;
  }
  if(ans === lastIdx) return;
  els.reader.querySelectorAll('.s.on').forEach(e=>e.classList.remove('on'));
  const list = els.reader.querySelectorAll(`[data-i="${ans}"]`);
  list.forEach(e=>e.classList.add('on'));
  lastIdx = ans;
  if(list.length && Date.now() - userTouchAt > 5000){
    list[0].scrollIntoView({block:'center', behavior:'smooth'});
  }
}

els.reader.addEventListener('wheel', ()=>userTouchAt = Date.now(), {passive:true});
els.reader.addEventListener('touchstart', ()=>userTouchAt = Date.now(), {passive:true});

els.reader.addEventListener('click', e=>{
  const t = e.target.closest('.s');
  if(!t) return;
  const i = +t.dataset.i;
  if(spans[i]) els.au.currentTime = spans[i].t / 1000 + 0.01;
});

document.addEventListener('keydown', e=>{
  if(e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  // 只有正在看朗读页时，空格才是播放/暂停；否则空格应该留给按钮自己
  if(!els.readView.classList.contains('on')) return;
  if(e.code === 'Space'){ e.preventDefault(); els.btnPlay.click(); }
});

/* ================= 回首页（左上角标题 & 「换个文本」共用） ================= */
function goHome(clearText){
  runSeq++;                                  // 作废还在路上的合成/加载结果
  clearInterval(pollTimer); pollTimer = null;
  els.au.pause();
  els.readView.classList.remove('on');
  els.inputView.classList.remove('off');
  els.btnEdit.style.display = 'none';
  els.overlay.classList.remove('on');
  spans = []; lastIdx = -1; currentKey = ''; pendingPlay = false;
  history.replaceState(null, '', '/');
  if(clearText){
    clearTimeout(els.text._t);               // 掐掉还没落地的自动保存，不然刚清空又被写回去
    els.text.value = '';
    localStorage.removeItem('ra_text');
    updateCount();
  }
  els.text.focus();
}

els.btnHome.onclick = ()=>goHome(true);
els.btnEdit.onclick = ()=>goHome(false);
</script>
